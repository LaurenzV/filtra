[package]
name = "filtra_core"
description = "Pixel-level types and algorithms shared by the crates of filtra."
categories = ["graphics", "rendering"]
keywords = ["svg", "css", "filter"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
filtra_types = { workspace = true, optional = true }

[features]
default = ["all"]
all = ["convolve-matrix", "gaussian-blur", "lighting", "turbulence"]
convolve-matrix = ["dep:filtra_types", "filtra_types/convolve-matrix"]
gaussian-blur = []
lighting = []
turbulence = []

[lints]
workspace = true
