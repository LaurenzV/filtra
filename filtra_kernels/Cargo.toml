[package]
name = "filtra_kernels"
description = "Filter effect kernels on premultiplied RGBA8 pixmaps."
categories = ["graphics", "multimedia::images"]
keywords = ["filter", "image", "simd", "blur", "convolution"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# The `fearless_simd` flag to leave out the AVX2 versions of the kernels.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(disable_dispatch_avx2)"] }

[dependencies]
fearless_simd = { version = "1.2.0", default-features = false, features = ["std"] }
filtra_core = { workspace = true }
filtra_types = { workspace = true }

[features]
default = ["all"]
all = [
    "blend",
    "color-matrix",
    "component-transfer",
    "composite",
    "convolve-matrix",
    "diffuse-lighting",
    "displacement-map",
    "drop-shadow",
    "gaussian-blur",
    "merge",
    "morphology",
    "specular-lighting",
    "tile",
    "turbulence",
]
css-functions = ["color-matrix", "component-transfer", "drop-shadow", "gaussian-blur"]
blend = ["filtra_types/blend"]
color-matrix = []
component-transfer = []
composite = ["filtra_types/composite"]
convolve-matrix = ["filtra_types/convolve-matrix"]
diffuse-lighting = ["filtra_core/lighting"]
displacement-map = ["filtra_types/displacement-map"]
drop-shadow = ["gaussian-blur", "color-matrix", "merge"]
gaussian-blur = ["filtra_core/gaussian-blur"]
merge = []
morphology = ["filtra_types/morphology"]
specular-lighting = ["filtra_core/lighting"]
tile = []
turbulence = []
