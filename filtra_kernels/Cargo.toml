[package]
name = "filtra_kernels"
description = "Filter effect kernels on premultiplied RGBA8 pixmaps."
categories = ["graphics", "multimedia::images"]
keywords = ["filter", "image", "simd", "blur", "convolution"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
fearless_simd = { git = "https://github.com/LaurenzV/fearless_simd", rev = "9c349b2ddb91884e12e39271dd0c48ee1a164d22", default-features = false, features = ["std"] }
filtra_types = { workspace = true }

[features]
default = ["all"]
all = [
    "blend",
    "color-matrix",
    "component-transfer",
    "composite",
    "convolve-matrix",
    "diffuse-lighting",
    "displacement-map",
    "drop-shadow",
    "gaussian-blur",
    "merge",
    "morphology",
    "specular-lighting",
    "tile",
    "turbulence",
]
css-functions = ["color-matrix", "component-transfer", "drop-shadow", "gaussian-blur"]
blend = ["filtra_types/blend"]
color-matrix = []
component-transfer = []
composite = ["filtra_types/composite"]
convolve-matrix = ["filtra_types/convolve-matrix"]
diffuse-lighting = []
displacement-map = ["filtra_types/displacement-map"]
drop-shadow = ["gaussian-blur", "color-matrix", "merge"]
gaussian-blur = []
merge = []
morphology = ["filtra_types/morphology"]
specular-lighting = []
tile = []
turbulence = []
