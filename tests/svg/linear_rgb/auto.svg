<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>auto lets the implementation choose; sRGB is used</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" color-interpolation-filters="auto">
    <feColorMatrix type="saturate" values="0.3"/>
  </filter>
  <g filter="url(#f)">
    <rect x="16" y="16" width="20" height="20" fill="#e8833a"/>
    <rect x="40" y="16" width="20" height="20" fill="#2a9d8f"/>
    <rect x="64" y="16" width="20" height="20" fill="#7b5ea7"/>
    <rect x="16" y="40" width="20" height="20" fill="#e8833a" fill-opacity="0.6"/>
    <rect x="40" y="40" width="20" height="20" fill="#2a9d8f" fill-opacity="0.6"/>
    <rect x="64" y="40" width="20" height="20" fill="#7b5ea7" fill-opacity="0.6"/>
    <rect x="16" y="64" width="20" height="20" fill="#e8833a" fill-opacity="0.25"/>
    <rect x="40" y="64" width="20" height="20" fill="#2a9d8f" fill-opacity="0.25"/>
    <rect x="64" y="64" width="20" height="20" fill="#7b5ea7" fill-opacity="0.25"/>
  </g>
</svg>
