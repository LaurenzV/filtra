<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>feOffset and feTile in linearRGB keep dark translucent colors unchanged</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feOffset dx="5" dy="5" x="30" y="30" width="40" height="40"/>
    <feTile/>
  </filter>
  <g filter="url(#f)">
    <rect x="25" y="25" width="25" height="50" fill="#0a0a14"/>
    <rect x="50" y="25" width="25" height="50" fill="#1e1428" fill-opacity="0.5"/>
    <rect x="25" y="40" width="50" height="20" fill="#3c2814" fill-opacity="0.3"/>
  </g>
</svg>
