<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>feMerge in linearRGB; the flood is given in sRGB and converted</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" color-interpolation-filters="linearRGB">
    <feOffset dx="12" dy="12" result="backdrop"/>
    <feFlood flood-color="#3c6ed2" flood-opacity="0.6" x="20" y="20" width="60" height="60" result="flood"/>
    <feMerge>
      <feMergeNode in="backdrop"/>
      <feMergeNode in="flood"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#f)">
    <rect x="10" y="10" width="20" height="20" fill="#e8833a"/>
    <rect x="34" y="10" width="20" height="20" fill="#2a9d8f"/>
    <rect x="58" y="10" width="20" height="20" fill="#7b5ea7"/>
    <rect x="10" y="34" width="20" height="20" fill="#e8833a" fill-opacity="0.6"/>
    <rect x="34" y="34" width="20" height="20" fill="#2a9d8f" fill-opacity="0.6"/>
    <rect x="58" y="34" width="20" height="20" fill="#7b5ea7" fill-opacity="0.6"/>
    <rect x="10" y="58" width="20" height="20" fill="#e8833a" fill-opacity="0.25"/>
    <rect x="34" y="58" width="20" height="20" fill="#2a9d8f" fill-opacity="0.25"/>
    <rect x="58" y="58" width="20" height="20" fill="#7b5ea7" fill-opacity="0.25"/>
  </g>
</svg>
