<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>A blur with an empty subregion is transparent, under an unblurred copy of the input</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feGaussianBlur stdDeviation="5" x="40" y="0" width="0" height="100" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#f)">
    <rect x="15" y="15" width="40" height="40" fill="#e8833a"/>
    <circle cx="50" cy="50" r="15" fill="#2a9d8f" fill-opacity="0.7"/>
  </g>
</svg>
