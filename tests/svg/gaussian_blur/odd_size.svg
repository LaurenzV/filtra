<svg xmlns="http://www.w3.org/2000/svg" width="97" height="61" viewBox="0 0 97 61">
  <title>An image with odd dimensions</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="97" height="61">
    <feGaussianBlur stdDeviation="3.3 6.7"/>
  </filter>
  <g filter="url(#f)">
    <rect x="11" y="9" width="37" height="29" fill="#e8833a"/>
    <circle cx="61" cy="33" r="17" fill="#2a9d8f" fill-opacity="0.7"/>
    <rect x="70" y="40" width="21" height="15" fill="#7b5ea7" fill-opacity="0.6"/>
  </g>
</svg>
