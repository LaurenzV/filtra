<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>A blurred 4 × 4 input, cut off at x = 16, and a second blur from x = 40 on that is too far from it to see it</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feFlood flood-color="#264653" x="8" y="48" width="4" height="4" result="dot"/>
    <feGaussianBlur in="dot" stdDeviation="3" x="0" y="0" width="16" height="100" result="near"/>
    <feGaussianBlur in="dot" stdDeviation="3" x="40" y="0" width="60" height="100" result="far"/>
    <feMerge>
      <feMergeNode in="near"/>
      <feMergeNode in="far"/>
    </feMerge>
  </filter>
  <g filter="url(#f)">
    <rect x="0" y="0" width="100" height="100" fill="#e8833a"/>
  </g>
</svg>
