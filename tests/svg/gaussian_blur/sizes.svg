<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <title>Blurs of 0.5, 1.5, 2.1, 3, 6 and 12, one per column, around each change in the number of halvings</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="80">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" x="0" y="0" width="20" height="80" result="b0"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" x="20" y="0" width="20" height="80" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.1" x="40" y="0" width="20" height="80" result="b2"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" x="60" y="0" width="20" height="80" result="b3"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" x="80" y="0" width="20" height="80" result="b4"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="12" x="100" y="0" width="20" height="80" result="b5"/>
    <feMerge>
      <feMergeNode in="b0"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="b3"/>
      <feMergeNode in="b4"/>
      <feMergeNode in="b5"/>
    </feMerge>
  </filter>
  <g filter="url(#f)">
    <rect x="0" y="14" width="120" height="16" fill="#e8833a"/>
    <rect x="0" y="44" width="120" height="22" fill="#7b5ea7" fill-opacity="0.6"/>
    <rect x="9" y="4" width="2" height="72" fill="#264653"/>
    <rect x="29" y="4" width="2" height="72" fill="#264653"/>
    <rect x="49" y="4" width="2" height="72" fill="#264653"/>
    <rect x="69" y="4" width="2" height="72" fill="#264653"/>
    <rect x="89" y="4" width="2" height="72" fill="#264653"/>
    <rect x="109" y="4" width="2" height="72" fill="#264653"/>
  </g>
</svg>
