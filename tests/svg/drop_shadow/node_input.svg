<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>Without a subregion of its own, the shadow is clipped to its input's</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feFlood flood-color="#2a9d8f" x="20" y="20" width="40" height="40" result="a"/>
    <feDropShadow in="a" dx="12" dy="12" stdDeviation="3" flood-color="#e8833a"/>
  </filter>
  <g filter="url(#f)">
    <rect x="15" y="15" width="40" height="40" fill="#e8833a"/>
    <rect x="45" y="45" width="40" height="40" fill="#7b5ea7" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="15" fill="#2a9d8f" fill-opacity="0.7"/>
    <path d="M 20 78 L 40 70 L 30 88 Z" fill="#264653"/>
  </g>
</svg>
