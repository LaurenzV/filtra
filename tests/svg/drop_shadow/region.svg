<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>The blur is clipped to the filter region before it is offset</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="10" y="10" width="80" height="80">
    <feDropShadow dx="-30" dy="-30" stdDeviation="4" flood-color="#264653"/>
  </filter>
  <g filter="url(#f)">
    <rect x="55" y="55" width="50" height="50" fill="#2a9d8f"/>
  </g>
</svg>
