<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>The noise is generated in the color-interpolation-filters space</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" color-interpolation-filters="sRGB"/>
  </filter>
  <g filter="url(#f)">
    <rect x="20" y="20" width="60" height="60" fill="#e8833a"/>
  </g>
</svg>
