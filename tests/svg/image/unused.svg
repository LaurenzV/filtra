<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>An image that the result doesn't use doesn't affect it</title>
  <defs>
    <g id="mark">
      <circle cx="50" cy="50" r="20" fill="#2a9d8f"/>
      <path d="M 10 90 L 30 70 L 40 95 Z" fill="#264653" fill-opacity="0.7"/>
    </g>
  </defs>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage href="#mark"/>
    <feOffset in="SourceGraphic" dx="5" dy="5"/>
  </filter>
  <g filter="url(#f)">
    <rect x="15" y="15" width="40" height="40" fill="#e8833a"/>
    <rect x="45" y="45" width="40" height="40" fill="#7b5ea7" fill-opacity="0.6"/>
  </g>
</svg>
