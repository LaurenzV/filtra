<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>The color-burn blend mode with black, gray and white bars onto black, gray and white columns</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" color-interpolation-filters="sRGB">
    <feFlood flood-color="#000000" x="5" y="5" width="30" height="90" result="black"/>
    <feFlood flood-color="#808080" x="35" y="5" width="30" height="90" result="gray"/>
    <feFlood flood-color="#ffffff" x="65" y="5" width="30" height="90" result="white"/>
    <feMerge result="backdrop">
      <feMergeNode in="black"/>
      <feMergeNode in="gray"/>
      <feMergeNode in="white"/>
    </feMerge>
    <feBlend in="SourceGraphic" in2="backdrop" mode="color-burn"/>
  </filter>
  <g filter="url(#f)">
    <rect x="5" y="5" width="90" height="30" fill="#000000"/>
    <rect x="5" y="35" width="90" height="30" fill="#808080"/>
    <rect x="5" y="65" width="90" height="30" fill="#ffffff"/>
  </g>
</svg>
