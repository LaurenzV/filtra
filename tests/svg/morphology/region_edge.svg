<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>Pixels outside the input are transparent, so erosion eats in from the region's edges</title>
  <filter id="f" filterUnits="userSpaceOnUse" x="20" y="20" width="60" height="60">
    <feMorphology radius="4"/>
  </filter>
  <g filter="url(#f)">
    <rect x="15" y="15" width="40" height="40" fill="#e8833a"/>
    <rect x="45" y="45" width="40" height="40" fill="#7b5ea7" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="15" fill="#2a9d8f" fill-opacity="0.7"/>
    <rect x="10" y="72" width="30" height="3" fill="#264653"/>
    <rect x="80" y="10" width="2" height="30" fill="#264653"/>
  </g>
</svg>
