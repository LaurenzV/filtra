[package]
name = "filtra_plan"
description = "Plans the evaluation of SVG and CSS filter effects."
categories = ["graphics", "rendering"]
keywords = ["svg", "css", "filter"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
filtra_core = { workspace = true }
filtra_types = { workspace = true }

[features]
default = ["all"]
all = [
    "blend",
    "color-matrix",
    "component-transfer",
    "composite",
    "convolve-matrix",
    "diffuse-lighting",
    "displacement-map",
    "drop-shadow",
    "flood",
    "gaussian-blur",
    "merge",
    "morphology",
    "offset",
    "specular-lighting",
    "tile",
    "turbulence",
]
css-functions = ["color-matrix", "component-transfer", "drop-shadow", "gaussian-blur"]
blend = ["filtra_types/blend"]
color-matrix = ["filtra_types/color-matrix"]
component-transfer = ["filtra_types/component-transfer"]
composite = ["filtra_types/composite"]
convolve-matrix = ["filtra_types/convolve-matrix"]
diffuse-lighting = ["filtra_types/diffuse-lighting", "filtra_core/lighting"]
displacement-map = ["filtra_types/displacement-map"]
drop-shadow = ["filtra_types/drop-shadow", "gaussian-blur", "color-matrix", "merge"]
flood = ["filtra_types/flood"]
gaussian-blur = ["filtra_types/gaussian-blur", "filtra_core/gaussian-blur"]
merge = ["filtra_types/merge"]
morphology = ["filtra_types/morphology"]
offset = ["filtra_types/offset"]
specular-lighting = ["filtra_types/specular-lighting", "filtra_core/lighting"]
tile = ["filtra_types/tile"]
turbulence = ["filtra_types/turbulence"]
