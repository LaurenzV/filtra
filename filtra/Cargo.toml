[package]
name = "filtra"
description = "Applies SVG and CSS filter effects to pixmaps."
categories = ["graphics", "rendering", "multimedia::images"]
keywords = ["svg", "css", "filter", "image", "simd"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
filtra_core = { workspace = true }
filtra_kernels = { workspace = true }
filtra_types = { workspace = true }

[features]
default = ["all"]
all = [
    "blend",
    "color-matrix",
    "component-transfer",
    "composite",
    "convolve-matrix",
    "diffuse-lighting",
    "displacement-map",
    "drop-shadow",
    "flood",
    "gaussian-blur",
    "merge",
    "morphology",
    "offset",
    "specular-lighting",
    "tile",
    "turbulence",
]
css-functions = ["color-matrix", "component-transfer", "drop-shadow", "gaussian-blur"]
blend = ["filtra_kernels/blend"]
color-matrix = ["filtra_kernels/color-matrix"]
component-transfer = ["filtra_kernels/component-transfer"]
composite = ["filtra_kernels/composite"]
convolve-matrix = ["filtra_core/convolve-matrix", "filtra_kernels/convolve-matrix"]
diffuse-lighting = ["filtra_core/lighting", "filtra_kernels/diffuse-lighting"]
displacement-map = ["filtra_kernels/displacement-map"]
drop-shadow = ["gaussian-blur", "color-matrix", "merge", "offset"]
flood = []
gaussian-blur = ["filtra_core/gaussian-blur", "filtra_kernels/gaussian-blur"]
merge = ["filtra_kernels/merge"]
morphology = ["filtra_kernels/morphology"]
offset = []
specular-lighting = ["filtra_core/lighting", "filtra_kernels/specular-lighting"]
tile = ["filtra_kernels/tile"]
turbulence = ["filtra_core/turbulence", "filtra_kernels/turbulence"]

[lints]
workspace = true
