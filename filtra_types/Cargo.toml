[package]
name = "filtra_types"
description = "Types describing SVG and CSS filter effects."
categories = ["graphics", "rendering"]
keywords = ["svg", "css", "filter"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.149"

[features]
default = ["all"]
all = [
    "blend",
    "color-matrix",
    "component-transfer",
    "composite",
    "convolve-matrix",
    "diffuse-lighting",
    "displacement-map",
    "drop-shadow",
    "flood",
    "gaussian-blur",
    "merge",
    "morphology",
    "offset",
    "specular-lighting",
    "tile",
    "turbulence",
]
css-functions = ["color-matrix", "component-transfer", "drop-shadow", "gaussian-blur"]
blend = []
color-matrix = []
component-transfer = []
composite = []
convolve-matrix = []
diffuse-lighting = []
displacement-map = []
drop-shadow = []
flood = []
gaussian-blur = []
merge = []
morphology = []
offset = []
specular-lighting = []
tile = []
turbulence = []
serde = ["dep:serde"]
