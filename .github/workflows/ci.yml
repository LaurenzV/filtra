name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo fmt --check
      - run: cargo hack clippy --workspace --each-feature -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check -p filtra -p filtra_types -p filtra_plan -p filtra_kernels

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
        env:
          # Tests AVX2 on x86, even on runners with AVX-512.
          RUSTFLAGS: --cfg disable_dispatch_avx512

  test-wasm:
    name: test (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: wasm32
            rustflags: ''
          - target: wasm32, simd128
            rustflags: -C target-feature=+simd128
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@wasmtime
      - run: cargo test --workspace --all-features --release --target wasm32-wasip1
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir ${{ github.workspace }}::${{ github.workspace }}
          # Overflows show up on 32-bit targets.
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true
